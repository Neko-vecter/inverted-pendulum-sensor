[server]
mode = "espnow" # "espnow" (gateway serial) or "udp" (direct Wi-Fi).
# Used only in UDP mode.
bind_address = "0.0.0.0:5000"
stats_interval_secs = 1
log_level = "info" # error, warn, info, debug, trace

# Gateway settings used in ESP-NOW mode.
# Use a stable /dev/serial/by-id/... path on Linux, or e.g. "COM7" on Windows.
# Set server.mode = "udp" to use Wi-Fi / UDP instead.
[gateway]
serial = "/dev/ttyACM0"
baud_rate = 921600 # Optional; match the gateway for an external UART adapter.

# Map each sensor's Wi-Fi station MAC to its logical name.
# Replace these example MAC addresses with the values printed by the firmware.
[devices]
"AA:BB:CC:DD:EE:01" = "sensor_1"
"AA:BB:CC:DD:EE:02" = "sensor_2"
"AA:BB:CC:DD:EE:03" = "sensor_3"
