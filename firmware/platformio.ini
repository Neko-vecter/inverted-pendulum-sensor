; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [platformio]
; default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200
board_build.esp-idf.sdkconfig_path = .pio/build/seeed_xiao_esp32c6/sdkconfig
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.local"

[env:seeed-xiao-esp32-c5]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c5
framework = espidf
; Required by Seeed's ESP-IDF builder, but optional in its platform manifest.
platform_packages =
    tool-cmake@~3.30.2
    tool-ninja@^1.7.0
monitor_speed = 115200
board_build.esp-idf.sdkconfig_path = .pio/build/seeed-xiao-esp32-c5/sdkconfig
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.c5.local"
