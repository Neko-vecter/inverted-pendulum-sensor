[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pendulum-sensor-client"
version = "0.1.0"
description = "Async WebSocket client for the inverted pendulum sensor server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets>=14"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sensor_client*"]
